[build-system]
requires = [
    "hatchling>=1.25",
]
build-backend = "hatchling.build"

[project]
name = "ndtbl"
description = "This package provides a pure-Python way to create, inspect, and validate .ndtbl files without depending on the C++ binaries."
readme = "README.md"
authors = [
    { name = "Thomas Isensee", email = "thomas.isensee@iwr.uni-heidelberg.de" },
]
version = "0.3.0"
requires-python = ">=3.11"
license = "MIT"
keywords = [
  "ndtbl",
  "binary-format",
  "lookup-table",
  "multidimensional-table",
  "tabulated-data",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "click",
    "numpy",
]

[project.urls]
repository = "https://github.com/bwrse4hpc/ndtbl"
documentation = "https://ndtbl.readthedocs.io/"

[project.optional-dependencies]
docs = [
    "breathe",
    "myst_parser",
    "sphinx",
    "sphinx_rtd_theme",
]
lint = [
    "mypy",
    "ruff",
]
notebooks = [
    "jupyterlab",
    "matplotlib",
]
tests = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
ndtbl = "ndtbl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ndtbl"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = "doc"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "D",   # pydocstyle
    "E",   #pycodestyle error rules
    "F",   # Pyflakes
    "I",   # isort
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/ndtbl/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
