repos:
  # Format C++ code with Clang-Format - automatically applying the changes
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        args:
        - --style=Mozilla
        exclude: ^ext/

  # General purpose useful hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Unify file endings
      - id: end-of-file-fixer
      # Apply a file size limit of 500kB
      - id: check-added-large-files
      # Check json files for syntax errors
      - id: check-json
      # Simple parser validation of e.g. pyproject.toml
      - id: check-toml
      # Make sure that contained YAML files are well-formed
      - id: check-yaml
      # Ensure consistent line endings
      - id: mixed-line-ending
      # Sort lines in requirements files
      - id: requirements-txt-fixer
      # Trim trailing whitespace of all sorts
      - id: trailing-whitespace

  # GitHub Actions Workflow linter
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Run the linter
      - id: ruff-check
        types_or: [ python, pyi, jupyter, pyproject ]
        args: [ --fix, --show-fixes ]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: ".ipynb"

  - repo: https://github.com/citation-file-format/cffconvert
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff
