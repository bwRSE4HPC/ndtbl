name: Build and test C++

on:
  workflow_call:
  workflow_dispatch:


jobs:
  build-and-test-cpp:
    name: Testing on ${{matrix.os}} / mmap=${{ matrix.mmap }} / populate=${{ matrix.mmap_populate }} / lock=${{ matrix.mmap_lock }} / diagnostics=${{ matrix.mmap_diagnostics }}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            mmap: "OFF"
            mmap_populate: "OFF"
            mmap_lock: "OFF"
            mmap_diagnostics: "OFF"
          - os: ubuntu-latest
            mmap: "ON"
            mmap_populate: "OFF"
            mmap_lock: "OFF"
            mmap_diagnostics: "ON"
          - os: ubuntu-latest
            mmap: "ON"
            mmap_populate: "OFF"
            mmap_lock: "ON"
            mmap_diagnostics: "ON"
          - os: ubuntu-latest
            mmap: "ON"
            mmap_populate: "ON"
            mmap_lock: "ON"
            mmap_diagnostics: "ON"
          - os: macos-latest
            mmap: "OFF"
            mmap_populate: "OFF"
            mmap_lock: "OFF"
            mmap_diagnostics: "OFF"
          - os: macos-latest
            mmap: "ON"
            mmap_populate: "OFF"
            mmap_lock: "OFF"
            mmap_diagnostics: "OFF"
          - os: macos-latest
            mmap: "ON"
            mmap_populate: "OFF"
            mmap_lock: "ON"
            mmap_diagnostics: "OFF"
          - os: windows-latest
            mmap: "OFF"
            mmap_populate: "OFF"
            mmap_lock: "OFF"
            mmap_diagnostics: "OFF"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Configure CMake
      shell: bash
      run: >-
        cmake --preset test
        -Dndtbl_ENABLE_MMAP=${{ matrix.mmap }}
        -Dndtbl_ENABLE_MMAP_POPULATE=${{ matrix.mmap_populate }}
        -Dndtbl_ENABLE_MMAP_LOCK=${{ matrix.mmap_lock }}
        -Dndtbl_ENABLE_MMAP_DIAGNOSTICS=${{ matrix.mmap_diagnostics }}

    - name: Build
      shell: bash
      run: cmake --build --preset test

    - name: Run tests
      shell: bash
      run: ctest --preset test
