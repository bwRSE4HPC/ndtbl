name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  build-and-test-cpp:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.ci == 'true'
          || needs.changes.outputs.cpp_core == 'true'
          || needs.changes.outputs.cpp_tests == 'true'
          || needs.changes.outputs.app == 'true'
          || needs.changes.outputs.cpp_workflow == 'true' }}
    uses: ./.github/workflows/build-and-test-cpp.yml

  test-python-cpp-example:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.ci == 'true'
          || needs.changes.outputs.cpp_core == 'true'
          || needs.changes.outputs.python_core == 'true'
          || needs.changes.outputs.examples == 'true'
          || needs.changes.outputs.examples_workflow == 'true' }}
    uses: ./.github/workflows/test-python-cpp-example.yml

  test-cmake-consumers:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.ci == 'true'
          || needs.changes.outputs.cpp_core == 'true'
          || needs.changes.outputs.cpp_consumers == 'true'
          || needs.changes.outputs.app == 'true'
          || needs.changes.outputs.consumers_workflow == 'true' }}
    uses: ./.github/workflows/test-cmake-consumers.yml

  build-benchmarks:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.ci == 'true'
          || needs.changes.outputs.cpp_core == 'true'
          || needs.changes.outputs.benchmarks == 'true'
          || needs.changes.outputs.app == 'true'
          || needs.changes.outputs.benchmarks_workflow == 'true' }}
    uses: ./.github/workflows/build-benchmarks.yml

  test-python:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.ci == 'true'
          || needs.changes.outputs.python_core == 'true'
          || needs.changes.outputs.python_tests == 'true'
          || needs.changes.outputs.python_workflow == 'true' }}
    uses: ./.github/workflows/test-python.yml

  coverage:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.ci == 'true'
          || needs.changes.outputs.cpp_core == 'true'
          || needs.changes.outputs.cpp_tests == 'true'
          || needs.changes.outputs.app == 'true'
          || needs.changes.outputs.coverage == 'true'
          || needs.changes.outputs.python_core == 'true'
          || needs.changes.outputs.python_tests == 'true' }}
    uses: ./.github/workflows/coverage.yml
    with:
      cpp: >-
        ${{ github.event_name == 'workflow_dispatch'
            || needs.changes.outputs.ci == 'true'
            || needs.changes.outputs.cpp_core == 'true'
            || needs.changes.outputs.cpp_tests == 'true'
            || needs.changes.outputs.app == 'true'
            || needs.changes.outputs.coverage == 'true' }}
      python: >-
        ${{ github.event_name == 'workflow_dispatch'
            || needs.changes.outputs.ci == 'true'
            || needs.changes.outputs.python_core == 'true'
            || needs.changes.outputs.python_tests == 'true'
            || needs.changes.outputs.coverage == 'true' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
