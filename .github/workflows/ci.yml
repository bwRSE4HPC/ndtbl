name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  build-and-test-cpp:
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-and-test-cpp.yml

  test-python-cpp-example:
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/test-python-cpp-example.yml

  test-cmake-consumers:
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/test-cmake-consumers.yml

  build-benchmarks:
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-benchmarks.yml

  test-python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/test-python.yml

  coverage:
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/coverage.yml
    with:
      cpp: ${{ needs.changes.outputs.cpp == 'true' || github.event_name == 'workflow_dispatch' }}
      python: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
