name: Test Python

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-python:
    name: Testing on ${{matrix.os}} / Python ${{matrix.python-version}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.15"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install Python packages
      working-directory: ${{ github.workspace }}/python/ndtbl/
      run: |
        python -m pip install ".[tests,lint]"

    - name: Run mypy (non-blocking)
      continue-on-error: true
      working-directory: ${{ github.workspace }}/python/ndtbl/
      run: |
        python -m mypy --python-version "${{ matrix.python-version }}" src/

    - name: Run Python tests
      working-directory: ${{ github.workspace }}/python/ndtbl/
      run: |
        python -m pytest -s
